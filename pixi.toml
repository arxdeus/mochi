[workspace]
name = "mochi"
version = "0.1.0"
description = "Mojo-based port of the Maki coding agent"
channels = ["conda-forge", "https://conda.modular.com/max"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]
preview = ["pixi-build"]

[dependencies]
mojo = ">=1.0.0,<1.1.0"
mojo-curl = { git = "https://github.com/thatstoasty/mojo-curl.git", tag = "v0.4.2" }

[tasks]
build = "sh -c 'obj=/tmp/mochi-cancellation-$$.o; trap \"rm -f $obj\" EXIT; cc -std=c11 -O2 -c src/mochi/cancellation.c -o \"$obj\" || exit 1; ext=so; [ \"$(uname -s)\" = Darwin ] && ext=dylib; mojo build -I src -Xlinker \"$obj\" -D CURL_LIB_PATH=\"$CONDA_PREFIX/lib/libcurl.$ext\" -D CURL_WRAPPER_LIB_PATH=\"$CONDA_PREFIX/lib/libcurl_wrapper.$ext\" src/mochi/main.mojo -o dist/mochi'"
parity = "sh tests/parity.sh"
plugin-e2e = "sh tests/plugin_e2e.sh"
test = "sh -c 'obj=/tmp/mochi-cancellation-$$.o; bin=/tmp/mochi-test-$$; trap \"rm -f $obj $bin\" EXIT; cc -std=c11 -O2 -c src/mochi/cancellation.c -o \"$obj\" || exit 1; ext=so; [ \"$(uname -s)\" = Darwin ] && ext=dylib; for test in tests/*_test.mojo; do mojo build -I src -Xlinker \"$obj\" -D CURL_LIB_PATH=\"$CONDA_PREFIX/lib/libcurl.$ext\" -D CURL_WRAPPER_LIB_PATH=\"$CONDA_PREFIX/lib/libcurl_wrapper.$ext\" \"$test\" -o \"$bin\" && \"$bin\" || exit 1; done; sh tests/plugin_e2e.sh'"
